general {
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep/resume
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false              # respect systemd-inhibit from Caffeine
}

# Screen off: 30 minutes (1800s)
listener {
    timeout = 1800                                # 30 min
    on-timeout = hyprctl dispatch dpms off        # screen off
    on-resume = hyprctl dispatch dpms on          # screen on on activity
}

# Sleep / Suspend: 1 hour (3600s)
listener {
    timeout = 3600                                # 1 hour
    on-timeout = systemctl suspend                # suspend PC
}
